<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#09090b" />
  <rect x="4" y="4" width="92" height="92" rx="24" stroke="url(#g)" stroke-width="2" opacity="0.4" />
  <!-- Video Camera Icon -->
  <rect x="22" y="30" width="36" height="40" rx="8" fill="url(#g)" filter="url(#glow)" />
  <polygon points="62,42 78,32 78,68 62,58" fill="url(#g)" />
  <!-- Pulse Dot -->
  <circle cx="76" cy="24" r="6" fill="#10b981" />
  <circle cx="76" cy="24" r="10" stroke="#10b981" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
